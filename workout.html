<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운동 인증</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --pine: #1F5E4E; --pine-dark: #164638; --ink: #18211E; --sub: #5B6B65;
    --paper: #F7F8F5; --card: #FFFFFF; --line: #DDE3DE;
    --caution: #8A5A00; --caution-bg: #FFF4D6; --error: #B42318; --error-bg: #FDECEA;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font-family: "Pretendard Variable", Pretendard, -apple-system, "Malgun Gothic", sans-serif; line-height: 1.5; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.02em; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 12px; }
  .who { font-size: .9rem; color: var(--sub); text-align: right; }
  .badge { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: #E6EFEB; color: var(--pine); margin-left: 4px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: .85rem; color: var(--sub); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: #fff; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid #9BC7B8; outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 11px 14px; cursor: pointer; }
  .primary { background: var(--pine); color: #fff; font-weight: 600; width: 100%; margin-top: 14px; }
  .primary:hover { background: var(--pine-dark); }
  .ghost { background: #EEF2EF; color: var(--ink); }
  .link { background: none; color: var(--pine); padding: 4px 6px; text-decoration: underline; }
  button:disabled { opacity: .5; cursor: default; }
  .hidden { display: none !important; }
  .msg { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: .9rem; }
  .msg.error { background: var(--error-bg); color: var(--error); }
  .msg.info { background: #E6EFEB; color: var(--pine-dark); }
  .flags { margin-top: 12px; display: grid; gap: 6px; }
  .flag { background: var(--caution-bg); color: var(--caution); padding: 8px 12px; border-radius: 10px; font-size: .88rem; }
  .preview { margin-top: 10px; max-height: 240px; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
  /* 이번 주 막대 */
  .week-total { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
  .week-total strong { font-size: 2.4rem; letter-spacing: -0.03em; color: var(--pine); line-height: 1; }
  .week-total span { color: var(--sub); }
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 110px; }
  .bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: .75rem; color: var(--sub); }
  .bar i { display: block; width: 100%; max-width: 34px; background: var(--pine); border-radius: 6px 6px 2px 2px; min-height: 3px; }
  .bar.today b { color: var(--ink); }
  .bar.empty i { background: var(--line); }
  /* 기록 목록 */
  .item { border-top: 1px solid var(--line); padding: 12px 0; display: grid; gap: 4px; }
  .item:first-child { border-top: 0; }
  .item-head { display: flex; justify-content: space-between; gap: 8px; }
  .item small { color: var(--sub); }
  .item .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .item .chips span { font-size: .75rem; background: var(--caution-bg); color: var(--caution); padding: 2px 8px; border-radius: 999px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button { flex: 1; }
  .tabs { display: flex; gap: 6px; margin-bottom: 6px; }
  .tabs button { flex: 1; background: #EEF2EF; }
  .tabs button.on { background: var(--pine); color: #fff; }
  @media (max-width: 420px) { .row3 { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>운동 인증</h1>
    <div class="who hidden" id="who"></div>
  </div>

  <!-- 로그인 -->
  <section id="auth">
    <div class="tabs">
      <button id="tab-login" class="on" type="button">로그인</button>
      <button id="tab-signup" type="button">가입하기</button>
    </div>
    <div id="name-wrap" class="hidden">
      <label for="auth-name">이름</label>
      <input id="auth-name" placeholder="홍길동">
    </div>
    <label for="auth-email">이메일</label>
    <input id="auth-email" type="email" placeholder="me@example.com" autocomplete="email">
    <label for="auth-pw">비밀번호 (6자 이상)</label>
    <input id="auth-pw" type="password" autocomplete="current-password">
    <button class="primary" id="auth-btn" type="button">로그인</button>
    <div id="auth-msg"></div>
  </section>

  <div id="app" class="hidden">
    <!-- 이번 주 -->
    <section>
      <h2 id="week-title">이번 주</h2>
      <div class="week-total"><strong id="week-min">0</strong><span id="week-sub">분 · 인증 0회</span></div>
      <div class="bars" id="bars"></div>
    </section>

    <!-- 인증하기 -->
    <section>
      <h2>오늘 운동 인증하기</h2>
      <label for="photo">운동 기록 사진</label>
      <input id="photo" type="file" accept="image/*">
      <img id="preview" class="preview hidden" alt="선택한 사진">
      <button class="ghost" id="read-btn" type="button" style="width:100%;margin-top:10px" disabled>사진에서 읽기</button>
      <div id="read-msg"></div>

      <div class="row">
        <div><label for="f-date">날짜</label><input id="f-date" type="date"></div>
        <div><label for="f-kind">운동 종류</label>
          <select id="f-kind">
            <option>걷기</option><option>러닝</option><option>등산</option><option>사이클</option>
            <option>근력</option><option>요가</option><option>일상 활동</option><option>기타</option>
          </select>
        </div>
      </div>
      <div class="row3">
        <div><label for="f-min">시간 (분)</label><input id="f-min" type="number" min="0" step="0.1" inputmode="decimal"></div>
        <div><label for="f-km">거리 (km)</label><input id="f-km" type="number" min="0" step="0.01" inputmode="decimal"></div>
        <div><label for="f-kcal">칼로리</label><input id="f-kcal" type="number" min="0" step="1" inputmode="numeric"></div>
      </div>
      <div class="flags" id="flags"></div>
      <button class="primary" id="save-btn" type="button">확인했어요, 저장하기</button>
      <div id="save-msg"></div>
    </section>

    <!-- 내 기록 -->
    <section>
      <h2>이번 주 내 기록</h2>
      <div id="list"><small>아직 인증한 기록이 없어요. 위에서 첫 사진을 올려보세요.</small></div>
      <div class="actions" style="margin-top:12px">
        <button class="ghost" id="copy-btn" type="button">이번 주 요약 복사</button>
        <button class="ghost" id="kakao-btn" type="button">카카오톡으로 공유</button>
      </div>
      <div id="share-msg"></div>
    </section>

    <!-- 관리자 -->
    <section id="admin" class="hidden">
      <h2>전체 회원 이번 주 (관리자)</h2>
      <div id="admin-table"></div>
    </section>

    <button class="link" id="logout-btn" type="button">로그아웃</button>
  </div>
</main>

<script>
// =====================================================================
// [설정] 두 줄만 바꾸세요. Supabase → Project Settings → API 에서 복사
// 공개용 키(publishable 또는 anon)만 넣으세요. secret·service_role 키는 절대 넣지 마세요.
// =====================================================================
const SUPABASE_URL = "https://cyxhyigjjrbraehgzwhb.supabase.co";
const SUPABASE_KEY = "sb_publishable_RAy8GBHG34jedgBTTBQMwA_d8p-4I00";

// [선택] 카카오톡 공유: 카카오 개발자 앱의 JavaScript 키 (비워두면 휴대폰 공유하기 사용)
const KAKAO_JS_KEY = "";

const BUCKET = "workout-photos";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null, myProfile = null, recent = [], authMode = "login";
let selectedFile = null, compressed = null, photoHash = null, ocrNotes = [];

const $ = (id) => document.getElementById(id);
function show(el, on) { el.classList.toggle("hidden", !on); }
function message(id, text, type = "info") {
  $(id).innerHTML = "";
  if (!text) return;
  const d = document.createElement("div");
  d.className = "msg " + type; d.textContent = text; $(id).appendChild(d);
}
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function weekRange(base = new Date()) {
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  const day = (d.getDay() + 6) % 7; // 월요일 = 0
  const start = new Date(d); start.setDate(d.getDate() - day);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return { start, end };
}
const num = (v) => (v === null || v === undefined || v === "" || isNaN(Number(v))) ? null : Number(v);

// ---------------- 로그인 ----------------
function setAuthMode(mode) {
  authMode = mode;
  $("tab-login").classList.toggle("on", mode === "login");
  $("tab-signup").classList.toggle("on", mode === "signup");
  show($("name-wrap"), mode === "signup");
  $("auth-btn").textContent = mode === "signup" ? "가입하기" : "로그인";
  message("auth-msg", "");
}
$("tab-login").onclick = () => setAuthMode("login");
$("tab-signup").onclick = () => setAuthMode("signup");

$("auth-btn").onclick = async () => {
  const email = $("auth-email").value.trim(), password = $("auth-pw").value;
  if (!email || password.length < 6) return message("auth-msg", "이메일과 6자 이상 비밀번호를 입력하세요.", "error");
  $("auth-btn").disabled = true;
  try {
    if (authMode === "signup") {
      const name = $("auth-name").value.trim() || email.split("@")[0];
      const { data, error } = await db.auth.signUp({ email, password, options: { data: { name } } });
      if (error) throw error;
      if (!data.session) message("auth-msg", "가입은 됐지만 로그인되지 않았어요. Supabase에서 Confirm email이 켜져 있는지 확인하세요.", "error");
    } else {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (e) {
    message("auth-msg", "실패: " + e.message, "error");
  } finally { $("auth-btn").disabled = false; }
};
$("logout-btn").onclick = () => db.auth.signOut();

db.auth.onAuthStateChange((_event, session) => {
  me = session?.user || null;
  show($("auth"), !me); show($("app"), !!me); show($("who"), !!me);
  if (me && (_event === "SIGNED_IN" || _event === "INITIAL_SESSION")) setTimeout(start, 0);
});

async function start() {
  const { data, error } = await db.from("profiles").select("name, role").eq("id", me.id).maybeSingle();
  if (error) message("save-msg", "회원 정보를 읽지 못했어요: " + error.message + " (SQL을 실행했는지 확인)", "error");
  myProfile = data || { name: me.email.split("@")[0], role: "member" };
  $("who").innerHTML = "";
  $("who").append(myProfile.name || "");
  const b = document.createElement("span"); b.className = "badge"; b.textContent = myProfile.role; $("who").append(b);
  $("f-date").value = ymd(new Date());
  await loadRecords();
  if (myProfile.role === "admin") { show($("admin"), true); loadAdmin(); }
}

// ---------------- 사진 준비 ----------------
async function compressImage(file, max = 1280) {
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file);
  });
  const scale = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
}
async function sha256(file) {
  const buf = await crypto.subtle.digest("SHA-256", await file.arrayBuffer());
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function blobToBase64(blob) {
  return new Promise((res) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.readAsDataURL(blob); });
}

$("photo").onchange = async (e) => {
  selectedFile = e.target.files[0] || null;
  compressed = null; photoHash = null; ocrNotes = [];
  message("read-msg", ""); message("save-msg", "");
  $("read-btn").disabled = !selectedFile;
  if (!selectedFile) { show($("preview"), false); return renderFlags(); }
  try {
    compressed = await compressImage(selectedFile);
    photoHash = await sha256(selectedFile);
    $("preview").src = URL.createObjectURL(compressed); show($("preview"), true);
    if (recent.some((r) => r.photo_hash === photoHash)) ocrNotes.push("이미 올린 사진과 같은 파일이에요. 저장할 수 없어요.");
  } catch {
    message("read-msg", "사진을 열지 못했어요. 다른 사진을 선택하세요.", "error");
  }
  renderFlags();
};

// ---------------- AI 판독 ----------------
$("read-btn").onclick = async () => {
  if (!compressed) return;
  $("read-btn").disabled = true;
  message("read-msg", "AI가 사진 속 숫자를 읽는 중이에요…");
  try {
    const image = await blobToBase64(compressed);
    const { data, error } = await db.functions.invoke("workout-ocr", { body: { image, mime: "image/jpeg" } });
    if (error) {
      let detail = error.message;
      try { detail = (await error.context.json()).error || detail; } catch {}
      throw new Error(detail);
    }
    applyReading(data.result || {});
    message("read-msg", "읽은 값을 채웠어요. 사진과 비교해서 맞는지 확인하세요.");
  } catch (e) {
    message("read-msg", "읽기 실패: " + e.message + " · 값을 직접 입력해도 돼요.", "error");
  } finally { $("read-btn").disabled = false; }
};

function mapKind(label) {
  const t = (label || "").toLowerCase();
  if (/하이킹|등산|트레킹|hik|trek/.test(t)) return "등산";
  if (/러닝|달리기|조깅|run/.test(t)) return "러닝";
  if (/걷기|산책|walk/.test(t)) return "걷기";
  if (/자전거|사이클|bike|cycl/.test(t)) return "사이클";
  if (/근력|웨이트|헬스|weight/.test(t)) return "근력";
  if (/요가|필라테스|yoga/.test(t)) return "요가";
  return null;
}
function parseShownDate(text) {
  if (!text) return null;
  const today = new Date();
  let y = null, m = null, d = null, x;
  if ((x = text.match(/(\d{4})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/))) [y, m, d] = [x[1], x[2], x[3]].map(Number);
  else if ((x = text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/))) [m, d] = [x[1], x[2]].map(Number);
  else if ((x = text.match(/(\d{1,2})\s*[/.]\s*(\d{1,2})/))) [m, d] = [x[1], x[2]].map(Number);
  if (!m || !d) return null;
  if (!y) { y = today.getFullYear(); if (new Date(y, m - 1, d) > today) y -= 1; }
  const dt = new Date(y, m - 1, d);
  return isNaN(dt) ? null : dt;
}

// 받아쓴 값 → 앱 규칙으로 고르기
function applyReading(r) {
  ocrNotes = ocrNotes.filter((n) => n.startsWith("이미 올린"));
  const minutes = num(r["이동시간_분"]) ?? num(r["활동시간_분"]) ?? num(r["소요시간_분"]);
  const calories = num(r["활동칼로리_kcal"]) ?? num(r["칼로리_kcal"]);
  const km = num(r["거리_km"]);
  $("f-min").value = minutes ?? ""; $("f-km").value = km ?? ""; $("f-kcal").value = calories ?? "";

  let kind = r["화면유형"] === "하루합계" ? "일상 활동" : mapKind(r["운동종류_표시"]);
  if (!kind && km && minutes) kind = (km / (minutes / 60)) < 7 ? "걷기" : "러닝";
  $("f-kind").value = kind || "기타";

  const shown = parseShownDate(r["날짜_표시"]);
  $("f-date").value = ymd(shown || new Date());

  if (num(r["이동시간_분"]) !== null && num(r["소요시간_분"]) !== null) ocrNotes.push(`쉬는 시간을 뺀 이동 시간 ${num(r["이동시간_분"])}분으로 넣었어요. (전체 ${num(r["소요시간_분"])}분)`);
  if (num(r["총칼로리_kcal"]) !== null) ocrNotes.push("하루 총 칼로리가 아니라 활동 칼로리를 넣었어요.");
  if (r["화면유형"] === "하루합계") ocrNotes.push("하루 합계 화면이에요. 운동 1회 기록이 아니라 '일상 활동'으로 넣었어요.");
  if (!shown) ocrNotes.push("사진에 날짜가 없어서 오늘 날짜로 넣었어요. 다른 날 운동이면 날짜를 고치세요.");
  if (minutes === null) ocrNotes.push("사진에 운동 시간이 없어요. 시간을 직접 입력하세요.");
  renderFlags();
}

// 저장 전 검사 (입력값이 바뀔 때마다 다시 계산)
function currentFlags() {
  const flags = [...ocrNotes];
  const minutes = num($("f-min").value), km = num($("f-km").value), kind = $("f-kind").value;
  const date = $("f-date").value ? new Date($("f-date").value + "T00:00:00") : null;
  if (date) {
    const { start, end } = weekRange();
    if (date < start || date > end) flags.push("이번 주 날짜가 아니에요. 날짜를 확인하세요.");
  }
  if (km && minutes) {
    const speed = km / (minutes / 60);
    const limit = { "걷기": 7, "등산": 7, "일상 활동": 7, "러닝": 20, "사이클": 45 }[kind];
    if (limit && speed > limit) flags.push(`평균 속도가 시속 ${speed.toFixed(1)}km예요. ${kind}치고 빨라요. 차량 이동이 섞였는지 확인하세요.`);
  }
  if (date && km !== null && minutes !== null) {
    const same = recent.find((r) => r.workout_date === $("f-date").value &&
      Number(r.distance_km) === km && Math.round(Number(r.minutes)) === Math.round(minutes));
    if (same) flags.push("같은 날짜·거리·시간 기록이 이미 있어요. 같은 운동을 두 번 올린 건 아닌지 확인하세요.");
  }
  return flags;
}
function renderFlags() {
  const box = $("flags"); box.innerHTML = "";
  currentFlags().forEach((f) => { const d = document.createElement("div"); d.className = "flag"; d.textContent = f; box.appendChild(d); });
}
["f-date", "f-kind", "f-min", "f-km", "f-kcal"].forEach((id) => $(id).addEventListener("input", renderFlags));

// ---------------- 저장 ----------------
$("save-btn").onclick = async () => {
  message("save-msg", "");
  if (!compressed) return message("save-msg", "인증 사진을 먼저 선택하세요.", "error");
  if (recent.some((r) => r.photo_hash === photoHash)) return message("save-msg", "이미 올린 사진이에요. 다른 사진을 선택하세요.", "error");
  if (!$("f-date").value) return message("save-msg", "날짜를 입력하세요.", "error");
  $("save-btn").disabled = true;
  const path = `${me.id}/${Date.now()}.jpg`;
  try {
    const up = await db.storage.from(BUCKET).upload(path, compressed, { contentType: "image/jpeg" });
    if (up.error) throw new Error("사진 업로드 실패: " + up.error.message);
    const row = {
      workout_date: $("f-date").value, kind: $("f-kind").value,
      minutes: num($("f-min").value), distance_km: num($("f-km").value), calories: num($("f-kcal").value),
      photo_path: path, photo_hash: photoHash, flags: currentFlags().filter((f) => !f.startsWith("이미 올린")),
    };
    const ins = await db.from("workouts").insert(row);
    if (ins.error) {
      await db.storage.from(BUCKET).remove([path]);
      if (ins.error.code === "23505") throw new Error("이미 올린 사진이에요.");
      throw new Error("기록 저장 실패: " + ins.error.message);
    }
    message("save-msg", "저장했어요.");
    $("photo").value = ""; selectedFile = compressed = photoHash = null; ocrNotes = [];
    show($("preview"), false); $("read-btn").disabled = true; message("read-msg", "");
    ["f-min", "f-km", "f-kcal"].forEach((id) => $(id).value = ""); $("f-date").value = ymd(new Date());
    await loadRecords(); if (myProfile.role === "admin") loadAdmin();
  } catch (e) {
    message("save-msg", e.message, "error");
  } finally { $("save-btn").disabled = false; renderFlags(); }
};

// ---------------- 이번 주 ----------------
async function loadRecords() {
  const since = new Date(); since.setDate(since.getDate() - 60);
  const { data, error } = await db.from("workouts").select("*").eq("user_id", me.id)
    .gte("workout_date", ymd(since)).order("workout_date", { ascending: false });
  if (error) return message("save-msg", "기록을 읽지 못했어요: " + error.message, "error");
  recent = data || [];
  renderWeek(); renderFlags();
}
function weekRows(rows) {
  const { start, end } = weekRange();
  return rows.filter((r) => { const d = new Date(r.workout_date + "T00:00:00"); return d >= start && d <= end; });
}
function renderWeek() {
  const rows = weekRows(recent);
  const { start, end } = weekRange();
  const total = rows.reduce((s, r) => s + (Number(r.minutes) || 0), 0);
  $("week-title").textContent = `이번 주 ${start.getMonth() + 1}/${start.getDate()} ~ ${end.getMonth() + 1}/${end.getDate()}`;
  $("week-min").textContent = Math.round(total);
  $("week-sub").textContent = `분 · 인증 ${rows.length}회`;

  const names = ["월", "화", "수", "목", "금", "토", "일"];
  const perDay = names.map((_, i) => { const d = new Date(start); d.setDate(start.getDate() + i);
    return rows.filter((r) => r.workout_date === ymd(d)).reduce((s, r) => s + (Number(r.minutes) || 0), 0); });
  const max = Math.max(30, ...perDay);
  const todayIdx = (new Date().getDay() + 6) % 7;
  $("bars").innerHTML = "";
  perDay.forEach((m, i) => {
    const b = document.createElement("div"); b.className = "bar" + (m ? "" : " empty") + (i === todayIdx ? " today" : "");
    const bar = document.createElement("i"); bar.style.height = Math.max(3, (m / max) * 80) + "px";
    const v = document.createElement("span"); v.textContent = m ? Math.round(m) : "";
    const n = document.createElement("b"); n.textContent = names[i]; n.style.fontWeight = i === todayIdx ? 700 : 400;
    b.append(v, bar, n); $("bars").appendChild(b);
  });

  const list = $("list"); list.innerHTML = "";
  if (!rows.length) { list.innerHTML = "<small>아직 인증한 기록이 없어요. 위에서 첫 사진을 올려보세요.</small>"; return; }
  rows.forEach((r) => {
    const item = document.createElement("div"); item.className = "item";
    const head = document.createElement("div"); head.className = "item-head";
    const left = document.createElement("strong");
    left.textContent = `${r.workout_date.slice(5).replace("-", "/")} ${r.kind}`;
    const right = document.createElement("small");
    right.textContent = [r.minutes != null ? Math.round(r.minutes) + "분" : null, r.distance_km != null ? r.distance_km + "km" : null,
      r.calories != null ? r.calories + "kcal" : null].filter(Boolean).join(" · ");
    head.append(left, right); item.appendChild(head);
    if (r.flags?.length) {
      const chips = document.createElement("div"); chips.className = "chips";
      r.flags.forEach((f) => { const s = document.createElement("span"); s.textContent = f.split(".")[0]; chips.appendChild(s); });
      item.appendChild(chips);
    }
    const acts = document.createElement("div");
    const view = document.createElement("button"); view.className = "link"; view.textContent = "사진 보기";
    view.onclick = () => openPhoto(r.photo_path);
    const del = document.createElement("button"); del.className = "link"; del.textContent = "삭제";
    del.onclick = () => removeRecord(r);
    acts.append(view, del); item.appendChild(acts);
    list.appendChild(item);
  });
}
async function openPhoto(path) {
  if (!path) return;
  const { data, error } = await db.storage.from(BUCKET).createSignedUrl(path, 60);
  if (error) return message("share-msg", "사진을 열지 못했어요: " + error.message, "error");
  window.open(data.signedUrl, "_blank", "noopener");
}
async function removeRecord(r) {
  if (!confirm(`${r.workout_date} ${r.kind} 기록을 삭제할까요?`)) return;
  const { error } = await db.from("workouts").delete().eq("id", r.id);
  if (error) return message("share-msg", "삭제 실패: " + error.message, "error");
  if (r.photo_path) await db.storage.from(BUCKET).remove([r.photo_path]);
  await loadRecords(); if (myProfile.role === "admin") loadAdmin();
}

// ---------------- 공유 ----------------
function summaryText() {
  const rows = weekRows(recent);
  const { start, end } = weekRange();
  const total = rows.reduce((s, r) => s + (Number(r.minutes) || 0), 0);
  const km = rows.reduce((s, r) => s + (Number(r.distance_km) || 0), 0);
  const lines = rows.slice().reverse().map((r) => `- ${r.workout_date.slice(5).replace("-", "/")} ${r.kind} ${r.minutes != null ? Math.round(r.minutes) + "분" : ""}`.trim());
  return `[운동 인증] ${myProfile.name}\n이번 주(${start.getMonth() + 1}/${start.getDate()}~${end.getMonth() + 1}/${end.getDate()}) 인증 ${rows.length}회 · 총 ${Math.round(total)}분 · ${km.toFixed(1)}km\n` + lines.join("\n");
}
$("copy-btn").onclick = async () => {
  try { await navigator.clipboard.writeText(summaryText()); message("share-msg", "복사했어요. Claude에 붙여넣고 'PlayMCP로 카톡 나에게 보내줘'라고 해보세요."); }
  catch { message("share-msg", "복사하지 못했어요. 브라우저 권한을 확인하세요.", "error"); }
};
$("kakao-btn").onclick = async () => {
  const text = summaryText();
  if (KAKAO_JS_KEY && window.Kakao) {
    if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
    Kakao.Share.sendDefault({ objectType: "text", text: text.slice(0, 200),
      link: { webUrl: location.href.split("?")[0], mobileWebUrl: location.href.split("?")[0] } });
  } else if (navigator.share) {
    try { await navigator.share({ text }); } catch {}
  } else {
    message("share-msg", "이 기기에서는 공유하기를 쓸 수 없어요. '요약 복사'를 눌러 카톡에 붙여넣으세요.", "error");
  }
};
if (KAKAO_JS_KEY) {
  const s = document.createElement("script");
  s.src = "https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js";
  document.head.appendChild(s);
}

// ---------------- 관리자 ----------------
async function loadAdmin() {
  const { start, end } = weekRange();
  const [w, p] = await Promise.all([
    db.from("workouts").select("user_id, minutes, flags").gte("workout_date", ymd(start)).lte("workout_date", ymd(end)),
    db.from("profiles").select("id, name"),
  ]);
  const box = $("admin-table");
  if (w.error || p.error) { box.textContent = "불러오지 못했어요: " + (w.error || p.error).message; return; }
  const names = Object.fromEntries((p.data || []).map((x) => [x.id, x.name]));
  const sum = {};
  (w.data || []).forEach((r) => { const s = sum[r.user_id] ||= { n: 0, m: 0, f: 0 }; s.n++; s.m += Number(r.minutes) || 0; if (r.flags?.length) s.f++; });
  const table = document.createElement("table");
  table.innerHTML = "<tr><th>회원</th><th>인증</th><th>시간</th><th>확인 필요</th></tr>";
  (p.data || []).forEach((x) => {
    const s = sum[x.id] || { n: 0, m: 0, f: 0 };
    const tr = document.createElement("tr");
    [names[x.id] || "-", s.n + "회", Math.round(s.m) + "분", s.f ? s.f + "건" : "-"].forEach((v) => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
    table.appendChild(tr);
  });
  box.innerHTML = ""; box.appendChild(table);
}
</script>
